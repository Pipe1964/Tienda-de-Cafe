<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="./css/contact.css">
</head>
<body>

  <section class="contact">
    <div class="contact-container">
     
      <div class="contact-info">
        <h2>CONTACT US</h2>
        <div class="underline"></div>
        <ul>
          <li><i class="fa-solid fa-location-dot"></i> 123 Campsite Avenue, Wilderness, CA 98765</li>
          <li><i class="fa-solid fa-envelope"></i> info@coffeeshopwebsite.com</li>
          <li><i class="fa-solid fa-phone"></i> (123) 456-78909</li>
          <li><i class="fa-regular fa-clock"></i> Monday - Friday: 9:00 AM - 5:00 PM</li>
          <li><i class="fa-regular fa-clock"></i> Saturday: 10:00 AM - 3:00 PM</li>
          <li><i class="fa-regular fa-clock"></i> Sunday: Closed</li>
          <li><i class="fa-solid fa-globe"></i> www.codingnepalweb.com</li>
        </ul>
      </div>

      <div class="contact-form">
        <form action="#">
          <input type="text" placeholder="Your name" required>
          <input type="email" placeholder="Your email" required>
          <textarea placeholder="Your message" rows="5" required></textarea>
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
  </section>

</body>
</html>
